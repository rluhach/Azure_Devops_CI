parameters:
  - name: checkoutRepos
    type: stepList
    default: []

  

stages:
- stage: SecurityCheckJob
  displayName: CheckMarx Scan
  jobs:
  - job: RSGSecurityCheckJob
    displayName: Read Service Configs
    steps:
    - ${{ each repo in parameters.checkoutRepos }}:
      - ${{ each step in repo }}:
            ${{ step.key }}: ${{ step.value }}

  - job: FailIfCheckMarxThresholdIsInvalid
    dependsOn: RSGSecurityCheckJob
    condition: and( eq( dependencies.RSGSecurityCheckJob.outputs['sc.pipeline.checkMarxScan'], 'true') , notIn( dependencies.RSGSecurityCheckJob.outputs['sc.param.checkmarxThreshold'], 'STRICT', 'MODERATE'))
    steps:
    - script: |
        echo Failing this Job as CheckMarxThreshold value is invalid 
        exit 1
    
  - job: SecurityCheckJob
    dependsOn: RSGSecurityCheckJob
    condition: and( eq( dependencies.RSGSecurityCheckJob.outputs['sc.pipeline.checkMarxScan'], 'true') , in( dependencies.RSGSecurityCheckJob.outputs['sc.param.checkmarxThreshold'], 'STRICT', 'MODERATE'))
    variables:
      cxPreset: $[ dependencies.RSGSecurityCheckJob.outputs['sc.param.cxPreset'] ]
      projectName: $[ dependencies.RSGSecurityCheckJob.outputs['sc.param.cxProjectName'] ]
      checkmarxThreshold: $[ dependencies.RSGSecurityCheckJob.outputs['sc.param.checkmarxThreshold'] ]
    displayName: 'Security check the source code'
    steps:
      - template: ${{variables['System.DefaultWorkingDirectory']}}/devops-template/Naming_Standards.yml
      - template: ${{variables['System.DefaultWorkingDirectory']}}/devops-template/Checkmarx.yml
        parameters:
          checkmarxThreshold: $(checkmarxThreshold)
         

- stage: BuildDotNetWithSonar
  displayName: Build Dot Net with SonarQube
  jobs:
  - job: RSGBuildDotNetSonar
    displayName: Read Service Configs
    steps:
    - ${{ each repo in parameters.checkoutRepos }}:
      - ${{ each step in repo }}:
            ${{ step.key }}: ${{ step.value }}

  - job: FailIfSonarqubeThresholdIsInvalid
    dependsOn: RSGBuildDotNetSonar
    condition: and( eq( dependencies.RSGBuildDotNetSonar.outputs['sc.pipeline.sonarqubeScan'], 'true') , notIn( dependencies.RSGBuildDotNetSonar.outputs['sc.param.sonarqubeThreshold'], 'STRICT', 'MODERATE', 'OFF'))
    steps:
    - script: |
        echo Failing this Job as sonarqubeThreshold value is invalid 
        exit 1

  - job: BuildDotNetSonar
    dependsOn: RSGBuildDotNetSonar
    condition: and( eq( dependencies.RSGBuildDotNetSonar.outputs['sc.pipeline.build'], 'true') , eq( dependencies.RSGBuildDotNetSonar.outputs['sc.pipeline.sonarqubeScan'], 'true') , in( dependencies.RSGBuildDotNetSonar.outputs['sc.param.sonarqubeThreshold'], 'STRICT', 'MODERATE'))
    variables:
      solution: $[ dependencies.RSGBuildDotNetSonar.outputs['sc.param.solution'] ]
      buildConfiguration: $[ dependencies.RSGBuildDotNetSonar.outputs['sc.param.buildConfiguration'] ]
      sonarqubeThreshold: $[ dependencies.RSGBuildDotNetSonar.outputs['sc.param.sonarqubeThreshold'] ]      
    displayName: Build dotnet core project
    steps:
      - ${{ each repo in parameters.checkoutRepos }}:
        - ${{ each step in repo }}:
            ${{ step.key }}: ${{ step.value }}      
        
      #Prepare dotnet core project
      - template: templates/prepare-dotnet-core.yaml
        
      #Build dotnet core project"
      - template: templates/build-dotnet-core-Sonarqube.yaml
        parameters:
          solution: $(solution)
          buildConfiguration: $(buildConfiguration)
          sonarqubeThreshold: $(sonarqubeThreshold)
          
- stage: BuildDotNet
  displayName: Build Dot Net
  jobs:
  - job: RSGBuildDotNet
    displayName: Read Service Configs
    steps:
    - ${{ each repo in parameters.checkoutRepos }}:
      - ${{ each step in repo }}:
            ${{ step.key }}: ${{ step.value }}

  - job: BuildDotNet
    dependsOn: RSGBuildDotNet
    condition: and( eq( dependencies.RSGBuildDotNet.outputs['sc.pipeline.build'], 'true'), eq( dependencies.RSGBuildDotNet.outputs['sc.pipeline.sonarqubeScan'], 'false') )
    variables:
      solution: $[ dependencies.RSGBuildDotNet.outputs['sc.param.solution'] ]
      buildConfiguration: $[ dependencies.RSGBuildDotNet.outputs['sc.param.buildConfiguration'] ]      
    displayName: Build dotnet core project
    steps:
      - ${{ each repo in parameters.checkoutRepos }}:
        - ${{ each step in repo }}:
            ${{ step.key }}: ${{ step.value }}      
        
      #Prepare dotnet core project
      - template: templates/prepare-dotnet-core.yaml
        
      #Build dotnet core project"
      - template: templates/build-dotnet-core.yaml
        parameters:
          solution: $(solution)
          buildConfiguration: $(buildConfiguration)
          
- stage: BlackDuckScan
  displayName: BlackDuck Scan
  jobs:
  - job: RSGBlackDuckScan
    displayName: Read Service Configs
    steps:
    - ${{ each repo in parameters.checkoutRepos }}:
      - ${{ each step in repo }}:
            ${{ step.key }}: ${{ step.value }}
  
  - job: FailIfBlackduckThresholdIsInvalid
    dependsOn: RSGBlackDuckScan
    condition: and( eq( dependencies.RSGBlackDuckScan.outputs['sc.pipeline.blackDuckScan'], 'true') , notIn( dependencies.RSGBlackDuckScan.outputs['sc.param.blackduckThreshold'], 'STRICT', 'MODERATE'))
    steps:
    - script: |
        echo Failing this Job as blackduckThreshold value is invalid 
        exit 1
    
  - job: BlackDuckScan
    dependsOn: RSGBlackDuckScan
    condition: and( eq( dependencies.RSGBlackDuckScan.outputs['sc.pipeline.blackDuckScan'], 'true') , in( dependencies.RSGBlackDuckScan.outputs['sc.param.blackduckThreshold'], 'STRICT', 'MODERATE'))
    variables:
      blackduckThreshold: $[ dependencies.RSGBlackDuckScan.outputs['sc.param.blackduckThreshold'] ]
    displayName: BlackDuck scan on built project
    steps:
      - ${{ each repo in parameters.checkoutRepos }}:
        - ${{ each step in repo }}:
              ${{ step.key }}: ${{ step.value }}      
  # Run the BlackDuck scan  
      - template: ${{variables['System.DefaultWorkingDirectory']}}/devops-template/Naming_Standards.yml        
      - template: ${{variables['System.DefaultWorkingDirectory']}}/devops-template/Synopsys.yml
        parameters:
          SnTimeOut: 2400
          SnServiceConnection: Synopsys (BlackDuck) - tfs9dec - Token Based
      - template: ${{variables['System.DefaultWorkingDirectory']}}/templates/extract-blackduck-results.yaml
        parameters:
          blackduckThreshold: $(blackduckThreshold)
          
- stage: DockerBuildandPublish
  displayName: Docker Build and Publish
  jobs:
  - job: RSGDockerBuild
    displayName: Read Service Configs
    steps:
    - ${{ each repo in parameters.checkoutRepos }}:
      - ${{ each step in repo }}:
            ${{ step.key }}: ${{ step.value }}

  - job: DockerBuild
    dependsOn: RSGDockerBuild
    condition: and(succeeded(),eq( dependencies.RSGDockerBuild.outputs['sc.pipeline.dockerBuild'], 'true'),eq( dependencies.RSGDockerBuild.outputs['sc.pipeline.publishImage'], 'true'))
    variables:
      artifactoryDockerImageProject: $[ dependencies.RSGDockerBuild.outputs['sc.param.artifactoryDockerImageProject'] ]
      artifactoryDockerImageName: $[ dependencies.RSGDockerBuild.outputs['sc.param.artifactoryDockerImageName'] ]
      majorVersion: $[ dependencies.RSGDockerBuild.outputs['sc.param.majorVersion' ] ]
      projectName: $[ dependencies.RSGDockerBuild.outputs['sc.param.projectName' ] ]
    displayName: 'Build and Publish docker images'
    steps:
    - ${{ each repo in parameters.checkoutRepos }}:
      - ${{ each step in repo }}:
            ${{ step.key }}: ${{ step.value }}
    - task: DockerInstaller@0
      displayName: Docker Installer
      inputs:
        dockerVersion: 17.09.0-ce
        releaseType: stable

    #- task: Docker@2
    #  displayName: Build an image
    #  inputs:
    #    repository: '$(imageName)'
    #    command: 'build'
    #    Dockerfile: '$(build.artifactstagingdirectory)'
          
    - task: DownloadBuildArtifacts@0
      displayName: Download Artifact
      inputs:
        artifactName: 'drop_linux'   

    - task: ArtifactoryGenericDownload@3
      inputs:
        connection: 'Artifactory_GPS_BasicAuth'
        specSource: 'taskConfiguration'
        fileSpec: |
          {
            "files": [
              {
                "pattern": "docker-dev-local/Certificates/*",
                "target": "$(build.artifactstagingdirectory)/drop_linux/"
              }
            ]
          }
        failNoOp: true 
        collectBuildInfo: true    
    

    - task: PowerShell@2
      displayName: Fetch Dockerfile
      inputs:
        targetType: inline
        script: |
          $Files=Get-ChildItem -Path . -Filter Dockerfile -Recurse| % { $_.FullName }
          foreach ($File in $Files) {
                       Copy-Item -Path $File -Destination $(build.artifactstagingdirectory)/drop_linux/ -Force
                       }

    - task: CopyFilesOverSSH@0
      displayName: Copy files to Remote Docker machine
      inputs:
        sshEndpoint: 'CanadaVMtuads01'
        sourceFolder: '$(build.artifactstagingdirectory)/drop_linux/'
        contents: '**'
        targetFolder: '/opt/devops/$(projectName)'
        readyTimeout: '20000'


    
    - task: SSH@0
      displayName: 'Docker Build on Remote machine'
      inputs:
        sshEndpoint: 'CanadaVMtuads01'
        commands: |
          /opt/devops/buildDockerImage.sh $(artifactoryDockerImageProject) $(artifactoryDockerImageName) $(majorVersion) $(projectName)
      name: dockerbuild

    - task: SSH@0
      displayName: 'Delete files on Remote machine'
      inputs:
        sshEndpoint: 'CanadaVMtuads01'
        commands: 'rm -r /opt/devops/$(projectName)/*; rmdir /opt/devops/$(projectName)'
        
- stage: HelmChartsPrepare
  displayName: Helm Charts Prepare
  dependsOn: DockerBuildandPublish
  variables:
    imageversion: $[ stageDependencies.DockerBuildandPublish.DockerBuild.outputs['dockerbuild.dimg.version'] ]
    imageName: $[ stageDependencies.DockerBuildandPublish.DockerBuild.outputs['dockerbuild.dimg.name'] ]

  jobs:
  - job: RSGHelmChartsPrepare
    displayName: Read Service Configs
    steps:
    - ${{ each repo in parameters.checkoutRepos }}:
      - ${{ each step in repo }}:
            ${{ step.key }}: ${{ step.value }}

  - job: HelmChartsPrepare
    dependsOn: RSGHelmChartsPrepare
    condition: and(succeeded(),eq( dependencies.RSGHelmChartsPrepare.outputs['sc.pipeline.prepareHelm'], 'true'),eq( dependencies.RSGHelmChartsPrepare.outputs['sc.pipeline.publishHelm'], 'true'))
    variables:
      projectName: $[ dependencies.RSGHelmChartsPrepare.outputs['sc.param.projectName'] ]
    displayName: 'PrepareHelmCharts'
    steps:
    - ${{ each repo in parameters.checkoutRepos }}:
      - ${{ each step in repo }}:
            ${{ step.key }}: ${{ step.value }}
  

    - task: PowerShell@2
      displayName: Prepare Helm Charts
      inputs:
        targetType: 'filePath'
        filePath: $(System.DefaultWorkingDirectory)\main-pipeline-repo\scripts\prepare-helm-charts.ps1
        arguments: >
          $(imageversion)
          $(imageName)
         
        
      name: phc
        
  
    - task: HelmInstaller@1
      displayName: Helm Software installer
      inputs: 
        helmVersionToInstall: latest

    - script: |
        helm version
        helm repo list
      displayName: Validate Helm version and repo
      
    - task: HelmDeploy@0
      displayName: Helm packaging
      inputs:
        command: 'package'
        chartPath: $(phc.helmProjectTarget)
        destination: $(Build.ArtifactStagingDirectory)

    - task: ArtifactoryGenericUpload@2
      inputs:
        artifactoryService: 'Artifactory_GPS_BasicAuth'
        specSource: 'taskConfiguration'
        fileSpec: |
          {
            "files": [
              {
                "pattern": "$(Build.ArtifactStagingDirectory)/*.tgz",
                "target": "helm-local/"
              }
            ]
          }
        collectBuildInfo: true
        failNoOp: true



        