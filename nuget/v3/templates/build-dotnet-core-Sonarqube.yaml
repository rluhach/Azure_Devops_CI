parameters:
  - name: solution
    default: ''
  - name: BuildConfiguration
    default: ''
  - name: branchName
    default: ''
  - name: pullRequestId
    default: ''    

steps:
- template: ${{variables['System.DefaultWorkingDirectory']}}/devops-template/Naming_Standards.yml
      
- template: ${{variables['System.DefaultWorkingDirectory']}}/devops-template/Sonarqube_Prepare_Analysis.yml
  parameters:
    SqServiceConnection: SonarQube - tfs9dec - Token Based

- template: dotnet-framework-install.yaml
   
- task: DotNetCoreCLI@2
  displayName: 'dotnet build'
  inputs:
    command: 'build'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Nuget restore for test projects'
  inputs:
    command: 'restore'
    projects: '**/*Test*/*.csproj' 
    feedsToUse: 'config'
    nugetConfigPath: 'user-service-repo/Nuget.config'
    externalFeedCredentials: 'ArtifactoryNugetConnection'
    #externalFeedCredentials: 'Artifactory-NuGet-Deployer'
    noCache: true

- task: DotNetCoreCLI@2
  displayName: 'dotnet test'
  inputs:
    command: test
    projects: |
     **/*Test*/*.csproj 
     !**/*.Api.Test.csproj
    arguments: '--configuration $(buildConfiguration) --collect "Code coverage" --no-restore'

- template: ${{variables['System.DefaultWorkingDirectory']}}/devops-template/Sonarqube_Run_Code_Analysis.yml

- template: ${{variables['System.DefaultWorkingDirectory']}}/devops-template/Sonarqube_Publish.yml

- template: ${{variables['System.DefaultWorkingDirectory']}}/nuget/v3/templates/extract-sonarqube-results.yaml
  parameters:
    branchName: $(branchName)
    pullRequestId: $(pullRequestId)

- task: DotNetCoreCLI@2 
  displayName: 'nuget pack'
  inputs:
    command: 'pack'
    packagesToPack: '$(solution)'
    nobuild: true
    versioningScheme: 'byBuildNumber'
    packDestination: $(System.DefaultWorkingDirectory)/packages

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: nuget'
  inputs:
    targetPath: $(Build.ArtifactStagingDirectory)/packages
    ArtifactName: 'packages'
