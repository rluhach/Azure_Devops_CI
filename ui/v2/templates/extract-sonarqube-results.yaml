parameters:
  sonarqubeThreshold: ''
  branchName: ''
#Extract SonarQube Result 
steps:           
  - task: PowerShell@2
    displayName: Extract SonarQube Result
    inputs:
      targetType: 'filePath'
      filePath: $(System.DefaultWorkingDirectory)\main-pipeline-repo\ui\v2\scripts\extract-data-from-sonar.ps1         
      arguments: >
        -sqprojectname "$(svcProjectName)"  -sonarqubeThreshold "$(sonarqubeThreshold)" -branchName "$(branchName)"