parameters:
  - name: testPlatform
    default: 'linux-x64'
  - name: solution
    default: ''

steps:
- template: dotnet-framework-install.yaml

# - task: NuGetToolInstaller@1 # Optional if nuget.exe >= 4.8.5385 is already on the path  # Recommended by DevTool not to use as it is causing issue since VS2022 is not installed in build servers
