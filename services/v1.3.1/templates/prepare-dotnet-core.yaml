- task: DotNetCoreCLI@2
  displayName: 'Nuget restore'
  inputs:
    command: 'restore'
    projects: '$(solution)'
    feedsToUse: 'config'
    nugetConfigPath: 'user-service-repo/Nuget.config'
    externalFeedCredentials: 'ArtifactoryNugetConnection'
    #externalFeedCredentials: 'Artifactory-NuGet-Deployer'
    noCache: true

- task: NuGetAuthenticate@0
  inputs:
    nuGetServiceConnections: 'ArtifactoryNugetConnection'
- task: UseDotNet@2
