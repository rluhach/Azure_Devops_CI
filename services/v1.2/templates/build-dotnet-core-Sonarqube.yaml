parameters:
  - name: solution
    default: ''
  - name: BuildConfiguration
    default: ''
  - name: sonarqubeThreshold
    default: ''   
  - name: testPlatform
    default: 'linux-x64'
  - name: branchName
    default: ''
  - name: publishWebProjects
    default: ''
  

steps:
- template: ${{variables['System.DefaultWorkingDirectory']}}/devops-template/Naming_Standards.yml
      
- template: ${{variables['System.DefaultWorkingDirectory']}}/devops-template/Sonarqube_Prepare_Analysis.yml
  parameters:
    SqServiceConnection: SonarQube - tfs9dec - Token Based

- template: dotnet-framework-install.yaml

    
- task: DotNetCoreCLI@2
  displayName: 'dotnet build'
  inputs:
    projects: '$(solution)'
    arguments: '--no-restore'

- task: DotNetCoreCLI@2
  displayName: 'dotnet test'
  inputs:
    command: test
    projects: |
     **/*Test*/*.csproj 
     !**/*.Api.Test.csproj
    arguments: '--configuration $(buildConfiguration) --collect "Code coverage" --no-restore'

- template: ${{variables['System.DefaultWorkingDirectory']}}/devops-template/Sonarqube_Run_Code_Analysis.yml

- template: ${{variables['System.DefaultWorkingDirectory']}}/devops-template/Sonarqube_Publish.yml

- template: ${{variables['System.DefaultWorkingDirectory']}}/services/v1.2/templates/extract-sonarqube-results.yaml
  parameters:
    sonarqubeThreshold: $(sonarqubeThreshold)
   # branchName: ${{variables['Build.SourceBranch']}}
    branchName: $(branchName)

- task: DotNetCoreCLI@2
  displayName: 'Publish'
  inputs:
    command: publish
    publishWebProjects: '$(publishWebProjects)'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --output $(build.artifactstagingdirectory) --runtime $(testPlatform) --self-contained'
    zipAfterPublish: false

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: drop_linux'
  inputs:
    PathtoPublish: '$(build.artifactstagingdirectory)/user-service-repo'
    ArtifactName: 'drop_linux'
