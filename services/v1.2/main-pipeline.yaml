parameters:
  - name: checkoutRepos
    type: stepList
    default: []

  - name: serviceconfigfilename
    default: ''

  - name: project
    default: ''

  - name: vaultAgent
    default: false

  - name: service
    default: ''


stages:
- stage: ReadServiceConfigStage
  displayName: Read ServiceConfig Stage in CI
  jobs:
  - job: ReadServiceConfig
    displayName: Read Service Configs
    steps:
    - ${{ each repo in parameters.checkoutRepos }}:
      - ${{ each step in repo }}:
            ${{ step.key }}: ${{ step.value }}

- stage: SecurityCheckJob
  dependsOn: 
  - ReadServiceConfigStage
  displayName: CheckMarx Scan
  jobs:
  - job: FailIfCheckMarxThresholdIsInvalid
    condition: and( eq( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.pipeline.checkMarxScan'], 'true') , notIn( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.checkmarxThreshold'], 'STRICT', 'MODERATE'))
    steps:
    - script: |
        echo Failing this Job as CheckMarxThreshold value is invalid 
        exit 1
    
  - job: SecurityCheckJob
    condition: and( eq( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.pipeline.checkMarxScan'], 'true') , in( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.checkmarxThreshold'], 'STRICT', 'MODERATE'))
    variables:
      cxPreset: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.cxPreset'] ]
      projectName: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.cxProjectName'] ]
      applicationName: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.applicationName'] ]
      checkmarxThreshold: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.checkmarxThreshold'] ]
    displayName: 'Security check the source code'
    steps:
      - checkout: self
        path: .\s\user-service-repo
        clean: true
      - checkout: templates
        path: .\s\main-pipeline-repo
        clean: true

      - template: ${{variables['System.DefaultWorkingDirectory']}}/devops-template/Naming_Standards.yml
        parameters:
          ApplicationName: $(applicationName)
      - template: ${{variables['System.DefaultWorkingDirectory']}}/devops-template/Checkmarx.yml
        parameters:
          checkmarxThreshold: $(checkmarxThreshold)
        

- stage: BuildDotNetWithSonar
  dependsOn: 
  - ReadServiceConfigStage
  - SecurityCheckJob
  displayName: Build Dot Net with SonarQube
  jobs:
  - job: FailIfSonarqubeThresholdIsInvalid
    condition: and( eq( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.pipeline.sonarqubeScan'], 'true') , notIn( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.sonarqubeThreshold'], 'STRICT', 'MODERATE'))
    steps:
    - script: |
        echo Failing this Job as sonarqubeThreshold value is invalid 
        exit 1
  
  - job: BuildDotNetSonarEC2
    condition: and( eq( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.pipeline.buildForEC2'], 'true') , eq( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.pipeline.sonarqubeScan'], 'true') , in( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.sonarqubeThreshold'], 'STRICT', 'MODERATE'))
    variables:
      sonarqubeThreshold: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.sonarqubeThreshold'] ]
      solution: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.solution'] ]
      applicationName: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.applicationName'] ]
      buildConfiguration: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.buildConfiguration'] ]
      testPlatform: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.testPlatform'] ]
      serviceName: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.service.serviceName'] ]
      vaultAgent: ${{ parameters.vaultAgent }}
      branchType: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.branch'] ] 
      ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/') }}:
        branchName: $[ variables['Build.SourceBranch'] ]
      ${{ if startsWith(variables['Build.SourceBranch'], 'refs/pull/') }}:
        branchName: $[ variables['System.PullRequest.SourceBranch'] ] 
      publishWebProjects: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.publishWebProjects'] ]
      artifactoryParentFolder: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.artifactoryParentFolder'] ]
    displayName: Build dotnet core project
    steps:
      - checkout: self
        path: .\s\user-service-repo
        clean: true  
      - checkout: templates
        path: .\s\main-pipeline-repo
        clean: true 
      - checkout: cdtemplates
        path: .\s\cd-pipeline-repo
        clean: true

      #Prepare dotnet core project
      - template: templates/prepare-dotnet-core.yaml
        parameters:
          testPlatform: $(testPlatform)
          solution: $(solution)
        
      #Build dotnet core project"
      - template: templates/build-dotnet-core-Sonarqube-EC2.yaml
        parameters:
          solution: $(solution)
          ApplicationName: $(applicationName)
          buildConfiguration: $(buildConfiguration)
          testPlatform: $(testPlatform)
          serviceName: $(serviceName)
          branchType: $(branchType)
          vaultAgent: ${{ parameters.vaultAgent }}
          branchName: $(branchName)
          publishWebProjects: $(publishWebProjects)
          artifactoryParentFolder: $(artifactoryParentFolder)
  

  - job: BuildDotNetSonar
    condition: and( eq( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.pipeline.build'], 'true') , eq( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.pipeline.sonarqubeScan'], 'true') , in( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.sonarqubeThreshold'], 'STRICT', 'MODERATE'))
    variables:
      solution: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.solution'] ]
      buildConfiguration: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.buildConfiguration'] ]
      sonarqubeThreshold: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.sonarqubeThreshold'] ]
      testPlatform: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.testPlatform'] ]
      publishWebProjects: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.publishWebProjects'] ]
      branchName: ${{variables['Build.SourceBranch']}} 
    displayName: Build dotnet core project
    steps:
      - checkout: self
        path: .\s\user-service-repo
        clean: true  
      - checkout: templates
        path: .\s\main-pipeline-repo
        clean: true
      - checkout: cdtemplates
        path: .\s\cd-pipeline-repo
        clean: true
      #Prepare dotnet core project
      - template: templates/prepare-dotnet-core.yaml
        parameters:
          testPlatform: $(testPlatform)
          solution: $(solution)
        
      #Build dotnet core project"
      - template: templates/build-dotnet-core-Sonarqube.yaml
        parameters:
          solution: $(solution)
          buildConfiguration: $(buildConfiguration)
          sonarqubeThreshold: $(sonarqubeThreshold)
          testPlatform: $(testPlatform)
          branchName: $(branchName)
          publishWebProjects: $(publishWebProjects)

                    
- stage: BuildDotNet
  dependsOn: 
  - ReadServiceConfigStage
  - BuildDotNetWithSonar
  displayName: Build Dot Net
  jobs:
  - job: BuildDotNetEC2
    condition: and( eq( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.pipeline.sonarqubeScan'], 'false'), eq( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.pipeline.buildForEC2'], 'true') )
    variables:
      solution: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.solution'] ]
      buildConfiguration: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.buildConfiguration'] ]
      testPlatform: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.testPlatform'] ]
      serviceName: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.service.serviceName'] ]
      vaultAgent: ${{ parameters.vaultAgent }}
      publishWebProjects: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.publishWebProjects'] ]
      branchType: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.branch'] ] 
      artifactoryParentFolder: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.artifactoryParentFolder'] ]
    displayName: Build dotnet core project for EC2 Deployment
    steps:
      - checkout: self
        path: .\s\user-service-repo
        clean: true
      - checkout: templates
        path: .\s\main-pipeline-repo
        clean: true
      - checkout: cdtemplates
        path: .\s\cd-pipeline-repo
        clean: true
      #Prepare dotnet core project
      - template: templates/prepare-dotnet-core.yaml
        parameters:
          testPlatform: $(testPlatform)
          solution: $(solution)
       
      #Build dotnet core project"
      
      - template: templates/build-dotnet-core-EC2.yaml
        parameters:
          solution: $(solution)
          buildConfiguration: $(buildConfiguration)
          testPlatform: $(testPlatform)
          serviceName: $(serviceName)
          branchType: $(branchType)
          vaultAgent: ${{ parameters.vaultAgent }}
          publishWebProjects: $(publishWebProjects)
          artifactoryParentFolder: $(artifactoryParentFolder)
          
  - job: BuildDotNet  
    condition: and( eq( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.pipeline.build'], 'true'), eq( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.pipeline.sonarqubeScan'], 'false') )
    variables:
      solution: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.solution'] ]
      publishWebProjects: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.publishWebProjects'] ]
      buildConfiguration: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.buildConfiguration'] ]
      testPlatform: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.testPlatform'] ]      
    displayName: Build dotnet core project
    steps:
      #Prepare dotnet core project
      - template: templates/prepare-dotnet-core.yaml
        parameters:
          testPlatform: $(testPlatform)
          solution: $(solution)
      #Build dotnet core project"
      - template: templates/build-dotnet-core.yaml
        parameters:
          solution: $(solution)
          buildConfiguration: $(buildConfiguration) 
          publishWebProjects: $(publishWebProjects)
          testPlatform: $(testPlatform)   
                 
- stage: BlackDuckScan
  dependsOn: 
  - ReadServiceConfigStage
  - BuildDotNet
  displayName: BlackDuck Scan
  jobs:
  - job: FailIfBlackduckThresholdIsInvalid
    condition: and( eq( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.pipeline.blackDuckScan'], 'true') , notIn( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.blackduckThreshold'], 'STRICT', 'MODERATE'))
    steps:
    - script: |
        echo Failing this Job as blackduckThreshold value is invalid 
        exit 1
    
  - job: BlackDuckScan
    condition: and( eq( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.pipeline.blackDuckScan'], 'true') , in( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.blackduckThreshold'], 'STRICT', 'MODERATE'))
    variables:
      blackduckThreshold: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.blackduckThreshold'] ]
      applicationName: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.applicationName'] ]
    displayName: BlackDuck scan on built project
    steps:
      - checkout: self
        path: .\s\user-service-repo
        clean: true  
      - checkout: templates
        path: .\s\main-pipeline-repo
        clean: true
  # Run the BlackDuck scan  
      - template: ${{variables['System.DefaultWorkingDirectory']}}/devops-template/Naming_Standards.yml
        parameters:
          ApplicationName: $(applicationName)      
      - template: ${{variables['System.DefaultWorkingDirectory']}}/devops-template/Synopsys.yml
        parameters:
          SnTimeOut: 2400
          SnServiceConnection: Synopsys (BlackDuck) - tfs9dec - Token Based
          
- stage: DockerBuildandPublish
  dependsOn: 
  - ReadServiceConfigStage
  - BlackDuckScan
  displayName: Docker Build and Publish
  jobs:
  - job: DockerBuild
    condition: and(succeeded(),eq( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.pipeline.dockerBuild'], 'true'),eq( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.pipeline.publishImage'], 'true'))
    variables:
      artifactoryDockerImageProject: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.artifactoryDockerImageProject'] ]
      artifactoryDockerImageName: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.artifactoryDockerImageName'] ]
      majorVersion: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.majorVersion' ] ]
      projectName: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.projectName' ] ]
    displayName: 'Build and Publish docker images'
    steps:
    - checkout: self
      path: .\s\user-service-repo
      clean: true
    - task: DockerInstaller@0
      displayName: Docker Installer
      inputs:
        dockerVersion: 17.09.0-ce
        releaseType: stable

   #- task: Docker@2
   #  displayName: Build an image
    #  inputs:
    #    repository: '$(imageName)'
    #    command: 'build'
    #    Dockerfile: '$(build.artifactstagingdirectory)'
          
    - task: DownloadBuildArtifacts@0
      displayName: Download Artifact
      inputs:
        artifactName: 'drop_linux'   
    - task: ArtifactoryGenericDownload@3
      inputs:
        connection: 'Artifactory_GPS_BasicAuth'
        specSource: 'taskConfiguration'
        fileSpec: |
          {
            "files": [
              {
                "pattern": "docker-dev-local/Certificates/*",
                "target": "$(build.artifactstagingdirectory)/drop_linux/"
              }
            ]
          }
        failNoOp: true 
        collectBuildInfo: true    
    

    - task: PowerShell@2
      displayName: Fetch Dockerfile
      inputs:
        targetType: inline
        script: |
          $path=".\user-service-repo\src\"+ "${{parameters.service}}" 
          Write-Host "$path"
          $Files=Get-ChildItem -Path $path  -Filter Dockerfile -Recurse| % { $_.FullName }
          foreach ($File in $Files) {
                       Copy-Item -Path $File -Destination $(build.artifactstagingdirectory)/drop_linux/ -Force
                       }

    - task: CopyFilesOverSSH@0
      displayName: Copy files to Remote Docker machine
      inputs:
        sshEndpoint: 'CanadaVMtuads01'
        sourceFolder: '$(build.artifactstagingdirectory)/drop_linux/'
        contents: '**'
        targetFolder: '/opt/devops/$(projectName)'
        readyTimeout: '20000'


    
    - task: SSH@0
      displayName: 'Docker Build on Remote machine'
      inputs:
        sshEndpoint: 'CanadaVMtuads01'
        commands: |
          /opt/devops/buildDockerImage.sh $(artifactoryDockerImageProject) $(artifactoryDockerImageName) $(majorVersion) $(projectName)
      name: dockerbuild

    - task: SSH@0
      displayName: 'Delete files on Remote machine'
      inputs:
        sshEndpoint: 'CanadaVMtuads01'
        commands: 'rm -r /opt/devops/$(projectName)/*; rmdir /opt/devops/$(projectName)'
        
- stage: HelmChartsPrepare
  displayName: Helm Charts Prepare
  dependsOn: 
  - ReadServiceConfigStage
  - DockerBuildandPublish
  variables:
    imageversion: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['dockerbuild.dimg.version'] ]
    imageName: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['dockerbuild.dimg.name'] ]
  jobs:
  - job: HelmChartsPrepare
    condition: and(succeeded(),eq( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.pipeline.prepareHelm'], 'true'),eq( stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.pipeline.publishHelm'], 'true'))
    variables:
      projectName: $[ stageDependencies.ReadServiceConfigStage.ReadServiceConfig.outputs['sc.param.projectName'] ]
    displayName: 'PrepareHelmCharts'
    steps:
    - ${{ each repo in parameters.checkoutRepos }}:
      - ${{ each step in repo }}:
            ${{ step.key }}: ${{ step.value }}
    - script: echo ${{ parameters.serviceconfigfilename }}

    - task: PowerShell@2
      displayName: Prepare Helm Charts
      inputs:
        targetType: 'filePath'
        filePath: $(System.DefaultWorkingDirectory)\main-pipeline-repo\services\v1.2\scripts\prepare-helm-charts.ps1
        arguments: >
          $(imageversion)
          $(imageName)
          ${{parameters.serviceConfigfilename}}
          ${{parameters.project}}


      name: phc
        
  
    - task: HelmInstaller@1
      displayName: Helm Software installer
      inputs: 
        helmVersionToInstall: latest

    - script: |
        helm version
        helm repo list
      displayName: Validate Helm version and repo
      
    - task: HelmDeploy@0
      displayName: Helm packaging
      inputs:
        command: 'package'
        chartPath: $(phc.helmProjectTarget)
        destination: $(Build.ArtifactStagingDirectory)

    - task: ArtifactoryGenericUpload@2
      inputs:
        artifactoryService: 'Artifactory_GPS_BasicAuth'
        specSource: 'taskConfiguration'
        fileSpec: |
          {
            "files": [
              {
                "pattern": "$(Build.ArtifactStagingDirectory)/*.tgz",
                "target": "helm-local/"
              }
            ]
          }
        collectBuildInfo: true
        failNoOp: true