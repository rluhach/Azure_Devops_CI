parameters:
  - name: solution
    default: ''
  - name: BuildConfiguration
    default: ''
  - name: testPlatform
    default: 'linux-x64'
  - name: publishWebProjects
    default: ''


steps:
- template: dotnet-framework-install.yaml

- task: DotNetCoreCLI@2
  displayName: 'dotnet build'
  inputs:
    projects: '$(solution)'
    arguments: '--no-restore'

- task: DotNetCoreCLI@2
  displayName: 'dotnet test'
  inputs:
    command: test
    projects: |
     **/*Test*/*.csproj 
     !**/*.Api.Test.csproj
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Linux publish'
  inputs:
    command: publish
    publishWebProjects: '$(publishWebProjects)'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --output $(build.artifactstagingdirectory) --runtime $(testPlatform)  --no-restore'
    zipAfterPublish: false

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: drop_linux'
  inputs:
    PathtoPublish: '$(build.artifactstagingdirectory)/user-service-repo'
    ArtifactName: 'drop_linux'
